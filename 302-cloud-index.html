<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>302 作業管理室</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#21334b;font:16px system-ui,sans-serif}header{background:#183650;color:white;padding:26px max(20px,calc((100% - 1100px)/2));}h1{margin:0;font-size:28px}header p{margin:8px 0 0;color:#c7d9e7}main{max-width:1100px;margin:auto;padding:20px}.panel{background:white;border:1px solid #dce4eb;border-radius:15px;padding:18px;margin-bottom:16px}h2{font-size:19px;margin:0 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button,textarea{font:inherit;border:1px solid #c7d3df;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer;font-weight:600}button.primary{background:#176c81;color:white;border-color:#176c81}button:hover{filter:brightness(.95)}.stats,.students{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}.stat{padding:14px;background:#eef4f8;border-radius:10px}.stat strong{display:block;font-size:28px}.student{min-height:76px;text-align:left;position:relative}.student b{display:block;font-size:18px}.student small{display:block;margin-top:5px}.student[data-s="缺交"]{background:#ffe5e4;border-color:#e69b96;color:#902b28}.student[data-s="待訂正"]{background:#fff0ca;border-color:#e2bb60;color:#855a09}.student[data-s="已完成"]{background:#ddf3e7;border-color:#88c7a5;color:#17633d}.student[data-s="未檢查"]{background:#f4f6f8}.student[data-s="已繳交"]{background:#e0edfc;color:#24578d}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4e9ee}th{background:#eef4f8}small,.muted{color:#63768a}.danger{color:#a52a2a}dialog{border:1px solid #ccd6df;border-radius:14px;max-width:90vw;width:560px}textarea{width:100%;min-height:240px}label{display:block;font-size:13px;color:#52677a;margin-bottom:5px}footer{font-size:13px;color:#63768a;padding:8px}@media(max-width:600px){main{padding:10px}.students{grid-template-columns:repeat(3,1fr)}.row>*{max-width:100%}}@media print{header{background:white;color:black}.noprint,.students,dialog{display:none!important}.panel{border:0;padding:0}body{background:white}}
</style><header><h1>302 作業管理室</h1><p>缺交追蹤 · 訂正管理 · 補交確認</p></header><section class="panel" style="max-width:1060px;margin:16px auto"><div class="row"><button id="login" class="primary">Google 帳號登入</button><button id="logout" hidden>登出</button><button id="importLocal" hidden>匯入舊版本機紀錄</button><span id="sync">請登入教師帳號</span></div></section><main id="workspace" hidden><div class="panel noprint"><h2>① 建立作業</h2><div class="row"><div><label>指定日期</label><input id="date" type="date"></div><div><label>科目</label><select id="subject"><option>國語</option><option>數學</option><option>社會</option><option>自然</option><option>英語</option><option>其他</option></select></div><div><label>作業名稱</label><input id="name" placeholder="例：數習第52頁"></div><button class="primary" id="add">＋ 新增作業</button></div></div><div class="panel"><h2>全班待處理總覽</h2><div class="stats" id="stats"></div></div><div class="panel noprint"><h2>② 快速登記</h2><div class="row"><select id="task"></select><button id="all">全班標為已繳交（僅未檢查）</button><button id="del" class="danger">刪除本作業</button></div><p class="muted">先選擇登記模式，再點學生座號。點同一學生可更新狀態。</p><div class="row" id="modes"></div><p id="current"></p><div class="students" id="students"></div></div><div class="panel"><h2>③ 作業追蹤清單</h2><div class="row noprint"><select id="filter"><option>待處理</option><option>缺交</option><option>待訂正</option><option>已完成</option><option>已繳交</option><option>全部紀錄</option></select><select id="person"></select><button id="csv">匯出 CSV</button><button onclick="window.print()">列印清單</button></div><p class="muted" id="count"></p><div class="scroll"><table><thead><tr><th>學生</th><th>日期</th><th>科目／作業</th><th>狀態</th><th>最後更新</th><th class="noprint">操作</th></tr></thead><tbody id="records"></tbody></table></div></div><div class="panel noprint"><h2>資料管理</h2><div class="row"><button id="roster">編輯學生姓名</button><button id="backup">備份 JSON</button><button id="restore">還原備份</button><input id="file" type="file" accept=".json" hidden></div><p class="muted">資料同步至教師帳號的雲端空間。請定期備份，勿將學生資料公開上傳。</p></div><footer>302 CLASSROOM · 教師專用</footer></main><dialog id="dlg"><h2>編輯學生名單</h2><p>依座號順序，每行一位學生，共25行。</p><textarea id="names"></textarea><div class="row"><button id="saveNames" class="primary">儲存</button><button onclick="document.getElementById('dlg').close()">取消</button></div></dialog><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyC5rJzkF4dMvkTBP0Ugh-kZShUHU2QbZkU",authDomain:"homework-48ae5.firebaseapp.com",projectId:"homework-48ae5",storageBucket:"homework-48ae5.firebasestorage.app",messagingSenderId:"112548413751",appId:"1:112548413751:web:51025d22942f2e9eb7dab2"});
const auth=getAuth(app), store=getFirestore(app);let ref=null,unsub=null,ready=false,busy=false,revision=0;
const blank=()=>({names:Array(25).fill(''),tasks:[]});

const $=id=>document.getElementById(id),KEY='302-homework-v1',statuses=['未檢查','已繳交','缺交','待訂正','已完成'];let db=blank();let mode='缺交',selected=db.tasks[0]?.id||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=today();async function save(){if(!ready||busy){return}const target=ref, expected=revision, payload=structuredClone(db);busy=true;$('workspace').inert=true;$('sync').textContent='同步中…';render();try{await runTransaction(store,async tx=>{const snap=await tx.get(target);if((snap.data()?.revision||0)!==expected)throw Error('其他裝置已更新，請重新操作');tx.set(target,{data:payload,revision:expected+1})});if(ref===target)$('sync').textContent='已送出雲端更新'}catch(e){if(ref===target){alert('未儲存：'+e.message+'。請重新載入確認最新資料。');location.reload()}}finally{if(ref===target){busy=false;$('workspace').inert=false}}}function student(i){return String(i+1).padStart(2,'0')+' '+(db.names[i]||'號')}function set(t,i,s){t.records[i]={s,at:new Date().toLocaleString('zh-TW',{hour12:false})};save()}function rows(){return db.tasks.flatMap(t=>Object.entries(t.records).map(([i,r])=>({t,i:Number(i),...r})))}function filtered(){let f=$('filter').value,p=$('person').value;return rows().filter(r=>(p===''||r.i===Number(p))&&(f==='全部紀錄'||(f==='待處理'?['缺交','待訂正'].includes(r.s):r.s===f))).sort((a,b)=>b.t.date.localeCompare(a.t.date)||a.i-b.i)}function render(){const p=$('person').value;$('person').innerHTML='<option value="">所有學生</option>'+db.names.map((n,i)=>`<option value="${i}">${esc(student(i))}</option>`).join('');$('person').value=p||'';let rs=rows();$('stats').innerHTML=['缺交','待訂正','已完成','已繳交'].map(s=>`<div class="stat"><span>${s}</span><strong>${rs.filter(r=>r.s===s).length}</strong><small>筆作業紀錄</small></div>`).join('');$('task').innerHTML=db.tasks.length?db.tasks.map(t=>`<option value="${esc(t.id)}">${esc(t.date+' '+t.subject+' '+t.name)}</option>`).join(''):'<option value="">尚無作業</option>';if(!db.tasks.some(t=>t.id===selected))selected=db.tasks[0]?.id||'';$('task').value=selected;let t=db.tasks.find(t=>t.id===selected);$('modes').innerHTML=statuses.map(s=>`<button data-mode="${s}" class="${s===mode?'primary':''}">${s}</button>`).join('');$('current').textContent=t?'目前登記：'+mode:'請先新增作業';$('students').innerHTML=t?db.names.map((n,i)=>`<button class="student" data-i="${i}" data-s="${t.records[i]?.s||'未檢查'}"><b>${esc(student(i))}</b><small>${t.records[i]?.s||'未檢查'}</small></button>`).join(''):'';let list=filtered();$('count').textContent=`共 ${list.length} 筆`;$('records').innerHTML=list.map(r=>`<tr><td>${esc(student(r.i))}</td><td>${esc(r.t.date)}</td><td>${esc(r.t.subject+'／'+r.t.name)}</td><td>${esc(r.s)}</td><td>${esc(r.at)}</td><td class="noprint">${['缺交','待訂正'].includes(r.s)?`<button data-done="${esc(r.t.id)}" data-index="${r.i}">確認完成</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">目前沒有符合條件的紀錄。</td></tr>';}
$('add').onclick=()=>{let n=$('name').value.trim();if(!n||!$('date').value)return alert('請填寫日期與作業名稱');selected=Date.now().toString(36);db.tasks.unshift({id:selected,date:$('date').value,subject:$('subject').value,name:n,records:{}});$('name').value='';save()};$('task').onchange=e=>{selected=e.target.value;render()};$('modes').onclick=e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;render()}};$('students').onclick=e=>{let b=e.target.closest('[data-i]');if(b){let t=db.tasks.find(t=>t.id===selected);set(t,b.dataset.i,mode)}};$('all').onclick=()=>{let t=db.tasks.find(t=>t.id===selected);if(t&&confirm('將本作業尚未檢查的學生標為已繳交？')){db.names.forEach((n,i)=>{if(!t.records[i]||t.records[i].s==='未檢查')t.records[i]={s:'已繳交',at:new Date().toLocaleString('zh-TW')}});save()}};$('del').onclick=()=>{if(selected&&confirm('確定刪除整份作業及其紀錄？')){db.tasks=db.tasks.filter(t=>t.id!==selected);save()}};$('filter').onchange=render;$('person').onchange=render;$('records').onclick=e=>{let b=e.target.closest('[data-done]');if(b)set(db.tasks.find(t=>t.id===b.dataset.done),b.dataset.index,'已完成')};$('roster').onclick=()=>{$('names').value=db.names.join('\n');$('dlg').showModal()};$('saveNames').onclick=()=>{let a=$('names').value.split('\n');db.names=Array.from({length:25},(_,i)=>(a[i]||'').trim());$('dlg').close();save()};function download(n,s,type){let u=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download('302-backup-'+today()+'.json',JSON.stringify(db),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.names)||d.names.length!==25||!d.names.every(n=>typeof n==='string')||!Array.isArray(d.tasks)||!d.tasks.every(t=>typeof t.id==='string'&&typeof t.date==='string'&&typeof t.subject==='string'&&typeof t.name==='string'&&t.records&&Object.entries(t.records).every(([i,r])=>/^\d+$/.test(i)&&+i<25&&statuses.includes(r.s)&&typeof r.at==='string')))throw Error();if(confirm('還原將覆蓋目前資料，確定嗎？')){db=d;save()}}catch(e){alert('備份格式不正確')}finally{$('file').value=''}};$('csv').onclick=()=>{let a=[['座號','姓名','日期','科目','作業','狀態','最後更新'],...filtered().map(r=>[r.i+1,db.names[r.i],r.t.date,r.t.subject,r.t.name,r.s,r.at])];download('302-homework-'+today()+'.csv','\ufeff'+a.map(row=>row.map(x=>'"'+String(x).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};render();
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('sync').textContent='登入失敗：'+e.code}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsub)unsub();ref=null;ready=false;busy=false;db=blank();revision=0;render();$('dlg').close();$('workspace').hidden=true;$('workspace').inert=true;$('login').hidden=!!user;$('logout').hidden=!user;$('importLocal').hidden=true;$('sync').textContent=user?'讀取雲端資料…':'請登入教師帳號';if(!user)return;const target=doc(store,'teachers',user.uid);ref=target;unsub=onSnapshot(target,{includeMetadataChanges:true},snap=>{if(ref!==target||snap.metadata.hasPendingWrites||snap.metadata.fromCache)return;db=snap.data()?.data||blank();revision=snap.data()?.revision||0;ready=true;render();$('workspace').hidden=false;$('workspace').inert=busy;$('importLocal').hidden=false;$('sync').textContent='已同步 · '+user.email},e=>{$('sync').textContent='無法讀取：'+e.code+'（請檢查 Firestore 規則）';$('workspace').hidden=true;ready=false})});
$('importLocal').onclick=()=>{if(!ready||busy)return;try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||!Array.isArray(d.names)||!Array.isArray(d.tasks))return alert('此瀏覽器沒有舊版紀錄');if(db.tasks.length||db.names.some(Boolean))return alert('雲端已有資料，為避免覆蓋，請勿直接匯入。');if(confirm('將此瀏覽器的舊紀錄匯入目前登入的教師帳號？')){db=d;save()}}catch(e){alert('無法讀取舊紀錄')}};
</script></html>
