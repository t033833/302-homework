<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>302 家長作業查詢</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183650;font:16px/1.55 system-ui,sans-serif}header{background:#183650;color:white;padding:22px max(16px,calc((100% - 680px)/2))}header small{color:#d8e7f0;letter-spacing:.04em}h1{margin:4px 0;font-size:26px}header p{margin:4px 0 0}main{max-width:720px;margin:auto;padding:14px}section,details{background:white;border:1px solid #dce4eb;border-radius:14px;padding:16px;margin-bottom:12px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}input[type=password]{width:100%;min-height:46px;padding:10px 12px;border:1px solid #aabccc;border-radius:8px;font:inherit}input[type=checkbox]{width:18px;height:18px;flex-shrink:0}label{font-weight:600}.remember{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;margin:12px 0}.hint{display:block;font-size:13px;color:#53697c}button{font:inherit;font-weight:650;min-height:46px;padding:10px 14px;border:1px solid #176c81;border-radius:9px;background:#176c81;color:white;cursor:pointer}button.secondary{background:white;color:#176c81}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1 1 120px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2d83aa;outline-offset:3px}#status{font-size:14px;overflow-wrap:anywhere}article{padding:9px 0;border-bottom:1px solid #e0e7ef}article:last-child{border-bottom:0}article p{margin:3px 0;overflow-wrap:anywhere}small{color:#53697c}.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.counts div{padding:10px;background:#f4f7fa;border-radius:9px}.counts strong{display:block;font-size:24px}.missing{color:#a32d29}.correct{color:#895900}summary{font-weight:650;cursor:pointer;min-height:32px}[hidden]{display:none!important}
</style></head><body><header><small>302 CLASSROOM</small><h1>家長作業查詢</h1><p>個人專屬・免 Google 登入</p></header>
<main><section><form id="lookupForm"><label for="code">個人專屬查詢碼</label><p><input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上老師提供的完整查詢碼" aria-describedby="privacyHint"></p><label class="remember"><input id="remember" type="checkbox"> 記住這台私人裝置</label><small id="privacyHint" class="hint">請勿在共用裝置勾選。查詢碼等同個人查詢憑證，請勿轉傳或貼在群組。記住裝置並非綁定 LINE 帳號。</small><div class="actions"><button id="login" type="submit">查詢個人作業</button><button id="logout" class="secondary" type="button">結束／切換孩子</button></div></form><p id="status" role="status" aria-live="polite">請輸入老師私下提供的查詢碼。</p></section>
<div id="view" hidden><section><h2 id="seat"></h2><div class="counts"><div class="missing">未繳交<strong id="missingCount"></strong></div><div class="correct">待訂正<strong id="correctCount"></strong></div></div><p id="summary"></p><small id="updated"></small></section><section><h2 class="missing">尚未繳交</h2><div id="missing"></div></section><section><h2 class="correct">尚待訂正</h2><div id="correct"></div></section><details id="history"><summary>已繳交／已完成 <span id="doneCount"></span></summary><div id="done"></div></details></div>
<small>本頁僅供查詢，無法更改作業紀錄。如有疑問，請回 LINE 官方帳號聊天室聯絡導師。</small></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyC5rJzkF4dMvkTBP0Ugh-kZShUHU2QbZkU",authDomain:"homework-48ae5.firebaseapp.com",projectId:"homework-48ae5",storageBucket:"homework-48ae5.firebasestorage.app",messagingSenderId:"112548413751",appId:"1:112548413751:web:51025d22942f2e9eb7dab2"}),store=getFirestore(app),$=id=>document.getElementById(id);
const storageKey='302-parent-code-v43';
const validCode=c=>/^[a-f0-9]{64}$/.test(c);
let unsub=null,generation=0,currentCode='',verifiedCode='';
function readSaved(){try{return localStorage.getItem(storageKey)||''}catch{return ''}}
function forget(){try{localStorage.removeItem(storageKey);return true}catch{return false}}
function rememberCode(code){try{localStorage.setItem(storageKey,code);return true}catch{return false}}
function status(message){$('status').textContent=message}
function clear(){ $('view').hidden=true;$('history').open=false;for(const id of ['seat','summary','updated','missingCount','correctCount','doneCount','missing','correct','done'])$(id).textContent=''; }
function disconnect(){generation++;if(unsub){unsub();unsub=null}currentCode='';verifiedCode='';clear();$('code').value=''}
function end(){disconnect();const cleared=forget();$('remember').checked=false;status(cleared?'已結束查詢，請輸入另一位孩子的專屬查詢碼。':'已結束查詢；此瀏覽器無法確認清除記憶，請清除網站資料。')}
function show(id,records){const el=$(id);el.replaceChildren();if(!records.length){el.textContent='目前沒有此類紀錄';return}for(const r of records){const article=document.createElement('article'),p=document.createElement('p'),small=document.createElement('small');p.textContent=String(r.subject??'')+'／'+String(r.name??'');small.textContent=String(r.date??'')+'　'+String(r.status??'');article.append(p,small);el.append(article)}}
function fail(message,g){if(g!==generation)return;disconnect();forget();$('remember').checked=false;status(message)}
function renderData(d){const seat=Number(d?.seat);if(!Number.isInteger(seat)||seat<1||seat>25||!Array.isArray(d.records))return false;const records=d.records.filter(r=>r&&typeof r==='object'&&['缺交','待訂正','已繳交','已完成'].includes(r.status)).slice().sort((a,b)=>String(b.date??'').localeCompare(String(a.date??'')));const missing=records.filter(r=>r.status==='缺交'),correct=records.filter(r=>r.status==='待訂正'),done=records.filter(r=>['已完成','已繳交'].includes(r.status));$('seat').textContent=String(seat).padStart(2,'0')+' 號學生';$('missingCount').textContent=String(missing.length);$('correctCount').textContent=String(correct.length);$('doneCount').textContent='（'+done.length+'）';$('summary').textContent=missing.length+correct.length?'請協助孩子完成待處理作業。':'目前系統無缺交或待訂正紀錄（不含尚未檢查作業）。';const updated=new Date(d.updatedAt);$('updated').textContent=Number.isFinite(updated.getTime())?'更新時間：'+updated.toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'已取得雲端資料';show('missing',missing);show('correct',correct);show('done',done);$('view').hidden=false;return true}
function begin(raw,keepSaved=false){const code=String(raw??'').trim().toLowerCase();disconnect();if(!keepSaved)forget();if(!validCode(code)){status('查詢碼格式不正確，請完整貼上老師提供的64字元查詢碼。');return}currentCode=code;const g=generation;status('正在向雲端查詢…');if(navigator.onLine===false){status('目前離線，恢復網路後重新查詢。');return}try{const cancel=onSnapshot(doc(store,'codeViews',code),{includeMetadataChanges:true},snap=>{if(g!==generation)return;if(snap.metadata.fromCache||snap.metadata.hasPendingWrites){verifiedCode='';clear();status('等待雲端確認，暫不顯示紀錄…');return}if(!snap.exists()){fail('查詢碼無效或已撤銷，請聯絡老師。',g);return}if(!renderData(snap.data())){fail('查詢資料格式異常，請聯絡老師。',g);return}verifiedCode=code;if($('remember').checked){status(rememberCode(code)?'已連線，已記住私人裝置。':'已連線，但此瀏覽器無法記住裝置。')}else{forget();status('已連線，僅顯示這個查詢碼對應的資料。')}},()=>fail('無法查詢，請確認查詢碼或聯絡老師。',g));if(g===generation)unsub=cancel;else cancel()}catch{fail('無法查詢，請確認網路或聯絡老師。',g)}}
$('lookupForm').addEventListener('submit',e=>{e.preventDefault();begin($('code').value)});
$('logout').onclick=end;
$('remember').onchange=()=>{if(!$('remember').checked){status(forget()?'已取消裝置記憶。':'無法確認清除記憶，請清除網站資料。')}else if(verifiedCode&&!$('view').hidden){status(rememberCode(verifiedCode)?'已記住私人裝置。':'此瀏覽器無法記住裝置。')}else{status('雲端確認查詢碼後才會記住裝置。')}};
function handleIncoming(){const incoming=new URLSearchParams(location.hash.slice(1)).get('code');if(incoming===null)return false;disconnect();forget();$('remember').checked=false;try{history.replaceState(null,'',location.pathname+location.search)}catch{status('此瀏覽器無法安全處理專屬連結，請關閉頁面，從共用查詢入口貼上備用查詢碼。');return true}begin(incoming);return true}
function resumeSaved(){const saved=readSaved();if(!saved)return false;if(!validCode(saved)){forget();return false}$('remember').checked=true;begin(saved,true);return true}
window.addEventListener('hashchange',handleIncoming);
window.addEventListener('offline',()=>{verifiedCode='';clear();status('目前離線，暫不顯示紀錄。')});
window.addEventListener('online',()=>{if(currentCode)begin(currentCode,true);else status('網路已恢復，請查詢個人作業。')});
window.addEventListener('pagehide',()=>disconnect());
window.addEventListener('pageshow',e=>{if(e.persisted&&!handleIncoming()&&!resumeSaved()){disconnect();$('remember').checked=false;status('請重新輸入個人專屬查詢碼。')}});
if(!handleIncoming())resumeSaved();
</script></body></html>
