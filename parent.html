<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>302 家長作業查詢</title><style> *{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f1f5f9;color:#183650}header{background:#183650;color:white;padding:25px}h1{margin:0;font-size:26px}main{max-width:720px;margin:auto;padding:16px}section{background:white;border:1px solid #dce4eb;border-radius:14px;padding:18px;margin-bottom:14px}button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:9px;background:#176c81;color:white;cursor:pointer}h2{font-size:19px}article{padding:12px;border-bottom:1px solid #e0e7ef}article p{margin:5px 0;overflow-wrap:anywhere}small{color:#53697c}.missing{color:#a32d29}.correct{color:#895900} [hidden]{display:none!important}</style><header><h1>302 家長作業查詢</h1><p>陪伴孩子完成每一份學習任務</p></header><main><section><label for="code">個人專屬查詢碼</label><p><input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上老師提供的查詢碼" style="width:100%;padding:12px;font:inherit;border:1px solid #abbccc;border-radius:8px"></p><p><label><input id="remember" type="checkbox"> 記住此私人裝置（共用裝置請勿勾選）</label></p><button id="login">查詢個人作業</button> <button id="logout">結束查詢</button><p id="status" role="status">不需要 Google 帳號。請妥善保管查詢碼。</p></section><div id="view" hidden><section><h2 id="seat"></h2><p id="summary"></p><small id="updated"></small></section><section><h2 class="missing">尚未繳交</h2><div id="missing"></div></section><section><h2 class="correct">尚待訂正</h2><div id="correct"></div></section><section><h2>已繳交／已完成</h2><div id="done"></div></section></div><small>本頁僅供查詢。如有疑問，請聯絡導師。使用完畢請結束查詢。</small></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyC5rJzkF4dMvkTBP0Ugh-kZShUHU2QbZkU",authDomain:"homework-48ae5.firebaseapp.com",projectId:"homework-48ae5",storageBucket:"homework-48ae5.firebasestorage.app",messagingSenderId:"112548413751",appId:"1:112548413751:web:51025d22942f2e9eb7dab2"}),store=getFirestore(app),$=id=>document.getElementById(id);let unsub=null;
function clear(){ $('view').hidden=true;for(const id of ['seat','summary','updated','missing','correct','done'])$(id).textContent=''; }
function show(id,rs){const el=$(id);el.replaceChildren();if(!rs.length){el.textContent='目前沒有此類紀錄';return}for(const r of rs){const a=document.createElement('article'),p=document.createElement('p'),small=document.createElement('small');p.textContent=r.subject+'／'+r.name;small.textContent=r.date+'　'+r.status;a.append(p,small);el.append(a)}}
const storageKey="302-parent-code-v43";function forget(){try{localStorage.removeItem(storageKey)}catch{}}function rememberCode(code){try{localStorage.setItem(storageKey,code);return true}catch{return false}}let activeCode=null;let generation=0;function stop(){activeCode=null;generation++;if(unsub){unsub();unsub=null}clear();$('code').value='';$('status').textContent='請輸入個人專屬查詢碼。'}$('logout').onclick=()=>{forget();$('remember').checked=false;stop()};
$('login').onclick=()=>{const code=$('code').value.trim().toLowerCase();forget();stop();if(!/^[a-f0-9]{64}$/.test(code)){ $('status').textContent='查詢碼格式不正確，請完整貼上老師提供的查詢碼。';return}const g=generation;$('status').textContent='正在查詢…';unsub=onSnapshot(doc(store,'codeViews',code),{includeMetadataChanges:true},snap=>{if(g!==generation)return;if(snap.metadata.fromCache){clear();$('status').textContent='等待雲端確認…';return}if(!snap.exists()){activeCode=null;forget();clear();$('status').textContent='查詢碼無效或已撤銷，請聯絡老師。';return}activeCode=code;const d=snap.data(),rs=(d.records||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));$('seat').textContent=d.seat+' 號學生';const m=rs.filter(r=>r.status==='缺交'),c=rs.filter(r=>r.status==='待訂正');$('summary').textContent='缺交 '+m.length+' 筆，待訂正 '+c.length+' 筆';$('updated').textContent='更新時間：'+new Date(d.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});show('missing',m);show('correct',c);show('done',rs.filter(r=>['已完成','已繳交'].includes(r.status)));$('status').textContent=$('remember').checked?(rememberCode(code)?'已連線，已記住私人裝置':'已連線，但此瀏覽器無法記住裝置'):'已連線';$('view').hidden=false},()=>{if(g!==generation)return;activeCode=null;forget();clear();$('status').textContent='無法查詢，請確認查詢碼或聯絡老師。'})};$('remember').onchange=()=>{if(!$('remember').checked)forget();else if(!$('view').hidden&&activeCode){if(!rememberCode(activeCode))$('status').textContent='此瀏覽器無法記住裝置';else $('status').textContent='已連線，已記住私人裝置'}};const hash=new URLSearchParams(location.hash.slice(1));const incoming=hash.get('code');if(incoming!==null){history.replaceState(null,'',location.pathname+location.search);forget();$('code').value=incoming;$('login').click()}else{try{const saved=localStorage.getItem(storageKey);if(saved){$('remember').checked=true;$('code').value=saved;$('login').click()}}catch{}}window.addEventListener('pagehide',stop);window.addEventListener('pageshow',e=>{if(e.persisted){stop();$('status').textContent='請重新查詢個人作業。'}});
</script></html>
