<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>302 家長作業查詢</title><style> *{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f1f5f9;color:#183650}header{background:#183650;color:white;padding:25px}h1{margin:0;font-size:26px}main{max-width:720px;margin:auto;padding:16px}section{background:white;border:1px solid #dce4eb;border-radius:14px;padding:18px;margin-bottom:14px}button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:9px;background:#176c81;color:white;cursor:pointer}h2{font-size:19px}article{padding:12px;border-bottom:1px solid #e0e7ef}article p{margin:5px 0;overflow-wrap:anywhere}small{color:#53697c}.missing{color:#a32d29}.correct{color:#895900} [hidden]{display:none!important}</style><header><h1>302 家長作業查詢</h1><p>陪伴孩子完成每一份學習任務</p></header><main><section><button id="login">使用 Google 帳號登入</button><button id="logout" hidden>登出</button><p id="status" role="status">請使用老師已授權的 Google 帳號登入。</p></section><div id="view" hidden><section><h2 id="seat"></h2><p id="summary"></p><small id="updated"></small></section><section><h2 class="missing">尚未繳交</h2><div id="missing"></div></section><section><h2 class="correct">尚待訂正</h2><div id="correct"></div></section><section><h2>已繳交／已完成</h2><div id="done"></div></section></div><small>本頁僅供查詢。如有疑問，請聯絡導師。使用完畢請登出。</small></main><script type="module">

import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyC5rJzkF4dMvkTBP0Ugh-kZShUHU2QbZkU",authDomain:"homework-48ae5.firebaseapp.com",projectId:"homework-48ae5",storageBucket:"homework-48ae5.firebasestorage.app",messagingSenderId:"112548413751",appId:"1:112548413751:web:51025d22942f2e9eb7dab2"}),auth=getAuth(app),store=getFirestore(app),$=id=>document.getElementById(id);let unsub=null;
function clear(){ $('view').hidden=true;for(const id of ['seat','summary','updated','missing','correct','done'])$(id).textContent=''; }
function show(id,rs){const el=$(id);el.replaceChildren();if(!rs.length){el.textContent='目前沒有此類紀錄';return}for(const r of rs){const a=document.createElement('article'),p=document.createElement('p'),small=document.createElement('small');p.textContent=r.subject+'／'+r.name;small.textContent=r.date+'　'+r.status;a.append(p,small);el.append(a)}}
$('login').onclick=async()=>{try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,provider)}catch(e){$('status').textContent='登入未完成：'+e.code}};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(unsub)unsub();clear();$('login').hidden=!!u;$('logout').hidden=!u;if(!u){$('status').textContent='請使用老師已授權的 Google 帳號登入。';return}if(!u.email||!u.emailVerified){$('status').textContent='請使用已驗證的 Google 帳號。';return}$('status').textContent='正在查詢…';unsub=onSnapshot(doc(store,'parentViews',u.email),{includeMetadataChanges:true},snap=>{if(auth.currentUser?.uid!==u.uid)return;if(snap.metadata.fromCache){clear();$('status').textContent='等待雲端連線確認權限…';return}if(!snap.exists()){clear();$('status').textContent='此帳號尚未獲得老師授權，請聯絡導師。';return}const d=snap.data(),rs=(d.records||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));$('seat').textContent=d.seat+' 號學生';const m=rs.filter(r=>r.status==='缺交'),c=rs.filter(r=>r.status==='待訂正');$('summary').textContent='缺交 '+m.length+' 筆，待訂正 '+c.length+' 筆';$('updated').textContent='更新時間：'+new Date(d.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});show('missing',m);show('correct',c);show('done',rs.filter(r=>['已完成','已繳交'].includes(r.status)));$('status').textContent='已連線 · '+u.email;$('view').hidden=false},e=>{clear();$('status').textContent='無法查詢，請確認授權或聯絡老師（'+e.code+'）。'})});
</script></html>
