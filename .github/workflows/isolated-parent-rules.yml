name: Isolated parent rules test
on:
  push:
    branches: [test-parent-rules-emulator]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test with synthetic data in local emulator only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/302-rules-test"
          cd "$RUNNER_TEMP/302-rules-test"
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-tools@14 firebase@11.10.0 @firebase/rules-unit-testing@4
          cat > firebase.json <<'JSON'
          {"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}
          JSON
          cat > firestore.rules <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              function isTeacher() {
                return request.auth != null
                  && request.auth.uid == "synthetic-teacher";
              }
              match /teachers/{teacherId} {
                allow read, write: if isTeacher()
                  && teacherId == request.auth.uid;
              }
              match /codeViews/{code} {
                allow get: if code.matches('^[a-f0-9]{64}$');
                allow list: if false;
                allow create, update, delete: if isTeacher();
              }
              match /parentViews/{email} {
                allow get: if isTeacher() ||
                  (request.auth != null
                  && request.auth.token.email_verified == true
                  && request.auth.token.email == email
                  && request.auth.token.firebase.sign_in_provider == 'google.com');
                allow list: if false;
                allow create, update, delete: if isTeacher();
              }
            }
          }
          RULES
          cat > tests.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {initializeTestEnvironment,assertSucceeds,assertFails} from '@firebase/rules-unit-testing';
          import {doc,collection,getDoc,getDocs,setDoc,updateDoc,deleteDoc} from 'firebase/firestore';
          const env=await initializeTestEnvironment({projectId:'demo-302-parent-rules',firestore:{host:'127.0.0.1',port:8080,rules:readFileSync('firestore.rules','utf8')}});
          const A='a'.repeat(64),B='b'.repeat(64),wrong='c'.repeat(64);
          try {
            await env.withSecurityRulesDisabled(async ctx=>{
              const db=ctx.firestore();
              await setDoc(doc(db,'teachers','synthetic-teacher'),{test:true});
              await setDoc(doc(db,'codeViews',A),{seat:1,records:[]});
              await setDoc(doc(db,'codeViews',B),{seat:2,records:[]});
              await setDoc(doc(db,'parentViews','parent-a@example.test'),{seat:1});
              await setDoc(doc(db,'parentViews','parent-b@example.test'),{seat:2});
            });
            const guest=env.unauthenticatedContext().firestore();
            const teacher=env.authenticatedContext('synthetic-teacher').firestore();
            const parent=env.authenticatedContext('parent-a',{email:'parent-a@example.test',email_verified:true,firebase:{sign_in_provider:'google.com'}}).firestore();
            const unverified=env.authenticatedContext('parent-a',{email:'parent-a@example.test',email_verified:false,firebase:{sign_in_provider:'google.com'}}).firestore();
            assert.equal((await assertSucceeds(getDoc(doc(guest,'codeViews',A)))).data().seat,1);
            assert.equal((await assertSucceeds(getDoc(doc(guest,'codeViews',B)))).data().seat,2);
            assert.equal((await assertSucceeds(getDoc(doc(guest,'codeViews',wrong)))).exists(),false);
            await assertFails(getDoc(doc(guest,'codeViews','invalid')));
            await assertFails(getDocs(collection(guest,'codeViews')));
            await assertFails(getDocs(collection(parent,'codeViews')));
            await assertFails(setDoc(doc(guest,'codeViews',wrong),{seat:3}));
            await assertFails(updateDoc(doc(parent,'codeViews',A),{seat:9}));
            await assertFails(deleteDoc(doc(guest,'codeViews',A)));
            await assertFails(getDoc(doc(guest,'teachers','synthetic-teacher')));
            await assertFails(getDoc(doc(parent,'teachers','synthetic-teacher')));
            await assertSucceeds(getDoc(doc(teacher,'teachers','synthetic-teacher')));
            await assertFails(setDoc(doc(teacher,'teachers','other-teacher'),{test:true}));
            await assertFails(getDoc(doc(guest,'parentViews','parent-a@example.test')));
            assert.equal((await assertSucceeds(getDoc(doc(parent,'parentViews','parent-a@example.test')))).data().seat,1);
            await assertFails(getDoc(doc(parent,'parentViews','parent-b@example.test')));
            await assertFails(getDoc(doc(unverified,'parentViews','parent-a@example.test')));
            await assertFails(getDocs(collection(parent,'parentViews')));
            await assertFails(updateDoc(doc(parent,'parentViews','parent-a@example.test'),{seat:8}));
            await assertSucceeds(updateDoc(doc(teacher,'codeViews',A),{seat:1,records:[{status:'pending'}]}));
            await assertSucceeds(deleteDoc(doc(teacher,'codeViews',A)));
            assert.equal((await assertSucceeds(getDoc(doc(guest,'codeViews',A)))).exists(),false);
            console.log('PASS: synthetic rules tests, no production connection; possession of any valid existing code permits reading that code.');
          } finally {await env.cleanup()}
          JS
          npx --no-install firebase emulators:exec --project demo-302-parent-rules --only firestore "node tests.mjs"
