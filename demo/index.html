<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>302 V4.3 Pro 體驗版</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#183650;font:16px system-ui}header{background:#183650;color:white;padding:20px}h1{font-size:25px;margin:8px 0}main{max-width:720px;margin:auto;padding:12px}section{background:white;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #dce4eb}button,input,select{font:inherit;padding:10px;border:1px solid #bdcbd6;border-radius:9px;background:white;color:inherit;max-width:100%}button{cursor:pointer;font-weight:600;min-height:44px}button.active{background:#176c81;color:white}nav,.row{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.seat{padding:8px 2px;min-height:65px}.seat b{display:block;font-size:20px}.seat small{font-size:11px}.missing{background:#fee2e2;color:#991b1b}.correct{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.sent{background:#dbeafe;color:#1e40af}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}.stats div{background:#eef3f7;padding:8px 2px;border-radius:8px;font-size:12px}.stats b{display:block;font-size:23px}label{display:block;margin:8px 0}input,select{width:100%}p{line-height:1.5}small{color:inherit}article{padding:10px 0;border-bottom:1px solid #ddd}[hidden]{display:none!important}.note{background:#fff5d6;color:#76520b;padding:10px;border-radius:8px}#modes{position:sticky;top:0;background:white;padding:6px 0;z-index:1}#modes button{flex:1 1 28%;font-size:14px}button:disabled{opacity:.4}a{color:#176c81}
#jumpNav{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}#jumpNav button{pointer-events:auto;min-height:44px;padding:10px 15px;border:1px solid #176c81;border-radius:24px;background:#176c81;color:white;box-shadow:0 3px 12px #18365040;font-weight:700;cursor:pointer}#jumpNav button[hidden]{display:none!important}#jumpNav button:focus-visible{outline:3px solid #183650;outline-offset:3px}@media print{#jumpNav{display:none!important}}
</style><header><small>302 CLASSROOM · V4.3 PRO</small><h1>302 作業管理室</h1><div>獨立體驗版 · 虛構資料</div></header><main><p class="note">僅供測試：此頁不連接正式 Firebase；所有資料僅存在這台裝置的瀏覽器。請勿輸入真實學生資料。</p><nav><button id="homeBtn">首頁</button><button id="teacherBtn">教師端</button><button id="parentBtn">家長端</button></nav><div id="home"><section><h2>歡迎試用</h2><p>教師端可登記25位虛構學生的作業，家長端可查詢指定座號的結果。</p><button id="startTeacher" class="active">開始教師端</button> <button id="startParent">開始家長端</button></section></div><div id="teacher" hidden><section><h2>① 建立作業</h2><label>日期<input type="date" id="date"></label><label>科目<select id="subject"><option>國語</option><option>數學</option><option>自然</option><option>社會</option><option>英語</option><option>其他</option></select></label><label>作業名稱<input id="name" placeholder="例如：數習第52頁"></label><button id="add" class="active">＋ 新增作業</button></section><section><h2>全班作業總覽</h2><div id="stats" class="stats"></div></section><section><h2>② 快速登記</h2><select id="task"></select><p>選擇模式，再點選座號。</p><div class="row" id="modes"></div><div class="grid" id="seats"></div><p class="row"><button id="undo">復原上次登記</button><button id="all">全班未檢查標為已繳交</button><button id="del">刪除作業</button></p></section><section><h2>③ 缺交及訂正追蹤</h2><label>學生<select id="filter"></select></label><div id="pending"></div><button id="notice">產生家長通知</button><p id="noticeText" style="white-space:pre-wrap"></p></section><section><h2>家長端體驗</h2><p>選擇虛構座號，產生體驗專屬連結。</p><select id="shareSeat"></select><p><button id="share">產生連結</button></p><input id="shareLink" readonly><p><a id="openLink" hidden>開啟家長查詢</a></p></section><section><button id="reset">重置全部體驗資料</button></section></div><div id="parent" hidden><section><h2>家長個人作業查詢</h2><p>體驗碼為 DEMO01 至 DEMO25，僅供模擬，不是正式安全查詢碼。</p><input id="code" placeholder="例如 DEMO01" autocomplete="off"><label><input id="remember" type="checkbox" style="width:auto"> 記住此私人裝置（模擬）</label><button id="lookup" class="active">查詢</button> <button id="logout">結束查詢</button><p id="status" role="status"></p></section><section id="result" hidden><h2 id="who"></h2><div id="records"></div></section></div></main><script>
const $=x=>document.getElementById(x), statuses=['未檢查','已繳交','缺交','待訂正','已完成'], classes=['','sent','missing','correct','done'], key='302-v43-demo-data', mem='302-v43-demo-parent';const date=()=>new Date().toLocaleDateString('sv-SE');function seed(){return [{id:'a',date:date(),subject:'數學',name:'數習第52頁',records:{1:'缺交',3:'待訂正',5:'已繳交',8:'已完成'}},{id:'b',date:date(),subject:'國語',name:'生字練習',records:{1:'待訂正',2:'缺交'}}]}function read(k){try{return localStorage.getItem(k)}catch{return null}}function write(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}function forget(){try{localStorage.removeItem(mem)}catch{}}let tasks;try{tasks=JSON.parse(read(key))||seed()}catch{tasks=seed()}let selected=tasks[0]?.id,mode='缺交',undo=null,active=null;const seatName=i=>String(i).padStart(2,'0')+'號';function save(){write(key,JSON.stringify(tasks));render();if(active)showParent(active)}function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function options(el,items){const old=el.value;el.replaceChildren(...items.map(([v,t])=>{const o=node('option',t);o.value=v;return o}));if(items.some(x=>x[0]===old))el.value=old}const seats=Array.from({length:25},(_,i)=>[String(i+1),seatName(i+1)]);options($('filter'),[['','全班'],...seats]);options($('shareSeat'),seats);$('date').value=date();function page(p){for(const x of ['home','teacher','parent']){$(x).hidden=x!==p;$(x+'Btn').classList.toggle('active',x===p)}if(p==='parent'&&!active){const c=read(mem);if(c){$('code').value=c;$('remember').checked=true;lookup()}}}for(const x of ['home','teacher','parent'])$(x+'Btn').onclick=()=>page(x);$('startTeacher').onclick=()=>page('teacher');$('startParent').onclick=()=>page('parent');function render(){options($('task'),tasks.map(t=>[t.id,t.date+' '+t.subject+' '+t.name]));if(!tasks.some(t=>t.id===selected))selected=tasks[0]?.id;$('task').value=selected||'';const t=tasks.find(t=>t.id===selected);$('modes').replaceChildren(...statuses.map(s=>{const b=node('button',s,s===mode?'active':'');b.onclick=()=>{mode=s;render()};return b}));$('seats').replaceChildren(...(t?seats.map(([i])=>{const s=t.records[i]||statuses[0],b=node('button','','seat '+classes[statuses.indexOf(s)]);b.append(node('b',i.padStart(2,'0')),node('small',s));b.onclick=()=>{undo={id:t.id,i,old:t.records[i]};t.records[i]=mode;save()};return b}):[]));$('undo').disabled=!undo;$('all').disabled=$('del').disabled=!t;$('stats').replaceChildren(...statuses.slice(1).map(s=>{const d=node('div',s);d.append(node('b',String(tasks.reduce((n,t)=>n+Object.values(t.records).filter(v=>v===s).length,0))));return d}));const f=$('filter').value;const rows=tasks.flatMap(t=>Object.entries(t.records).filter(([i,s])=>(!f||i===f)&&['缺交','待訂正'].includes(s)).map(([i,s])=>({t,i,s})));$('pending').replaceChildren(...rows.map(({t,i,s})=>{const a=node('article',seatName(i)+' · '+t.subject+'／'+t.name+' · '+s);const b=node('button','確認完成');b.onclick=()=>{undo={id:t.id,i,old:s};t.records[i]='已完成';save()};a.append(document.createElement('br'),b);return a}));if(!rows.length)$('pending').textContent='目前沒有待處理紀錄'}$('task').onchange=()=>{selected=$('task').value;render()};$('filter').onchange=()=>{ $('noticeText').textContent='';render()};$('add').onclick=()=>{const name=$('name').value.trim();if(!name||!$('date').value)return alert('請填寫日期與名稱');selected=String(Date.now());tasks.unshift({id:selected,date:$('date').value,subject:$('subject').value,name,records:{}});undo=null;$('name').value='';save()};$('undo').onclick=()=>{if(!undo)return;const t=tasks.find(t=>t.id===undo.id);if(t){if(undo.old===undefined)delete t.records[undo.i];else t.records[undo.i]=undo.old}undo=null;save()};$('all').onclick=()=>{const t=tasks.find(t=>t.id===selected);if(!t||!confirm('確認批次登記？'))return;for(const [i] of seats)if(!t.records[i]||t.records[i]==='未檢查')t.records[i]='已繳交';undo=null;save()};$('del').onclick=()=>{if(confirm('刪除這份體驗作業？')){tasks=tasks.filter(t=>t.id!==selected);undo=null;save()}};$('notice').onclick=()=>{const i=$('filter').value;if(!i)return alert('請先選擇一位學生');$('noticeText').textContent='家長您好：'+seatName(i)+'尚待完成的作業：\n'+(tasks.filter(t=>['缺交','待訂正'].includes(t.records[i])).map(t=>t.date+' '+t.subject+'／'+t.name+'（'+t.records[i]+'）').join('\n')||'目前無待處理作業')};function showParent(i){active=i;$('result').hidden=false;$('who').textContent=seatName(i)+'虛構學生';$('records').replaceChildren(...['缺交','待訂正','已繳交','已完成'].map(s=>{const d=node('div','');d.append(node('h2',s));const list=tasks.filter(t=>t.records[i]===s);d.append(...(list.length?list.map(t=>node('article',t.date+' '+t.subject+'／'+t.name)): [node('p','目前沒有紀錄')]));return d}))}function lookup(){const c=$('code').value.trim().toUpperCase(),m=/^DEMO(0[1-9]|1[0-9]|2[0-5])$/.exec(c);forget();active=null;$('result').hidden=true;if(!m){$('status').textContent='體驗碼無效';return}showParent(String(Number(m[1])));$('status').textContent=$('remember').checked?(write(mem,c)?'已記住此裝置':'此瀏覽器不支援儲存'):'查詢成功'}$('lookup').onclick=lookup;$('remember').onchange=()=>{if(!$('remember').checked)forget();else if(active)write(mem,'DEMO'+active.padStart(2,'0'))};$('logout').onclick=()=>{forget();active=null;$('result').hidden=true;$('code').value='';$('remember').checked=false;$('status').textContent='已結束查詢'};$('share').onclick=()=>{const c='DEMO'+$('shareSeat').value.padStart(2,'0');const url=location.href.split('#')[0]+'#code='+c;$('shareLink').value=url;$('openLink').href='#code='+c;$('openLink').hidden=false};function fromHash(){if(location.hash==='#parent'){page('parent');return}const c=new URLSearchParams(location.hash.slice(1)).get('code');if(c){page('parent');$('remember').checked=false;$('code').value=c;lookup();try{history.replaceState(null,'',location.href.split('#')[0])}catch{}}}window.addEventListener('hashchange',fromHash);$('reset').onclick=()=>{if(confirm('重置虛構資料？')){tasks=seed();selected=tasks[0].id;undo=null;$('logout').click();save()}};render();page('home');fromHash();</script>
<div id="jumpNav" class="noprint" role="group" aria-label="頁面快速跳轉"><button type="button" id="jumpTop" aria-label="一鍵到頂部" title="一鍵到頂部" hidden>↑ 到頂部</button><button type="button" id="jumpBottom" aria-label="一鍵到底部" title="一鍵到底部" hidden>↓ 到底部</button></div><script>
(()=>{const up=document.getElementById('jumpTop'),down=document.getElementById('jumpBottom');const root=()=>document.scrollingElement||document.documentElement;const refresh=()=>{const el=root();up.hidden=el.scrollTop<=80;down.hidden=el.scrollHeight-el.scrollTop-el.clientHeight<=80};const jump=top=>{const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;window.scrollTo({top,behavior:reduced?'auto':'smooth'})};up.addEventListener('click',()=>jump(0));down.addEventListener('click',()=>jump(root().scrollHeight));window.addEventListener('scroll',refresh,{passive:true});window.addEventListener('resize',refresh);window.addEventListener('load',refresh);if('ResizeObserver' in window){new ResizeObserver(refresh).observe(document.body)}refresh()})();
</script>
