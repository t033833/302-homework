</style><header><small>302 CLASSROOM · V4.3 PRO</small><h1>302 作業管理室</h1><div>獨立體驗版 · 虛構資料</div></header><main><p class="note">僅供測試：此頁不連接正式 Firebase；所有資料僅存在這台裝置的瀏覽器。請勿輸入真實學生資料。</p><nav><button id="homeBtn">首頁</button><button id="teacherBtn">教師端</button><button id="parentBtn">家長端</button></nav><div id="home"><section><h2>歡迎試用</h2><p>教師端可登記25位虛構學生的作業，家長端可查詢指定座號的結果。</p><button id="startTeacher" class="active">開始教師端</button> <button id="startParent">開始家長端</button></section></div><div id="teacher" hidden><section><h2>① 建立作業</h2><label>日期<input type="date" id="date"></label><label>科目<select id="subject"><option>國語</option><option>數學</option><option>自然</option><option>社會</option><option>英語</option><option>其他</option></select></label><label>作業名稱<input id="name" placeholder="例如：數習第52頁"></label><button id="add" class="active">＋ 新增作業</button></section><section><h2>全班作業總覽</h2><div id="stats" class="stats"></div></section><section><h2>② 快速登記</h2><select id="task"></select><p>選擇模式，再點選座號。</p><div class="row" id="modes"></div><div class="grid" id="seats"></div><p class="row"><button id="undo">復原上次登記</button><button id="all">全班未檢查標為已繳交</button><button id="del">刪除作業</button></p></section><section><h2>③ 缺交及訂正追蹤</h2><label>學生<select id="filter"></select></label><div id="pending"></div><button id="notice">產生家長通知</button> <button id="classWord" class="active">全班通知 Word</button><p><small>全班 Word 依座號產生25份個別提醒，僅供教師使用。</small></p><p id="noticeText" style="white-space:pre-wrap"></p></section><section><h2>家長端體驗</h2><p>選擇虛構座號，產生體驗專屬連結。</p><select id="shareSeat"></select><p><button id="share">產生連結</button></p><input id="shareLink" readonly><p><a id="openLink" hidden>開啟家長查詢</a></p></section><section><button id="reset">重置全部體驗資料</button></section></div><div id="parent" hidden><section><h2>家長個人作業查詢</h2><p>體驗碼為 DEMO01 至 DEMO25，僅供模擬，不是正式安全查詢碼。</p><input id="code" placeholder="例如 DEMO01" autocomplete="off"><label><input id="remember" type="checkbox" style="width:auto"> 記住此私人裝置（模擬）</label><button id="lo const $=x=>document.getElementById(x), statuses=['未檢查','已繳交','缺交','待訂正','已完成'], classes=['','sent','missing','correct','done'], key='302-v43-demo-data', mem='302-v43-demo-parent';const date=()=>new Date().toLocaleDateString('sv-SE');function seed(){return [{id:'a',date:date(),subject:'數學',name:'數習第52頁',records:{1:'缺交',3:'待訂正',5:'已繳交',8:'已完成'}},{id:'b',date:date(),subject:'國語',name:'生字練習',records:{1:'待訂正',2:'缺交'}}]}function read(k){try{return localStorage.getItem(k)}catch{return null}}function write(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}function forget(){try{localStorage.removeItem(mem)}catch{}}let tasks;try{tasks=JSON.parse(read(key))||seed()}catch{tasks=seed()}let selected=tasks[0]?.id,mode='缺交',undo=null,active=null;const seatName=i=>String(i).padStart(2,'0')+'號';function save(){write(key,JSON.stringify(tasks));render();if(active)showParent(active)}function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function options(el,items){const old=el.value;el.replaceChildren(...items.map(([v,t])=>{const o=node('option',t);o.value=v;return o}));if(items.some(x=>x[0]===old))el.value=old}const seats=Array.from({length:25},(_,i)=>[String(i+1),seatName(i+1)]);options($('filter'),[['','全班'],...seats]);options($('shareSeat'),seats);$('date').value=date();function page(p){for(const x of ['home','teacher','parent']){$(x).hidden=x!==p;$(x+'Btn').classList.toggle('active',x===p)}if(p==='parent'&&!active){const c=read(mem);if(c){$('code').value=c;$('remember').checked=true;lookup()}}}for(const x of ['home','teacher','parent'])$(x+'Btn').onclick=()=>page(x);$('startTeacher').onclick=()=>page('teacher');$('startParent').onclick=()=>page('parent');function render(){options($('task'),tasks.map(t=>[t.id,t.date+' '+t.subject+' '+t.name]));if(!tasks.some(t=>t.id===selected))selected=tasks[0]?.id;$('task').value=selected||'';const t=tasks.find(t=>t.id===selected);$('modes').replaceChildren(...statuses.map   const xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1008" w:right="1152" w:bottom="1008" w:left="1152" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const files=[

function makeDemoNotice(i){const groups=[['缺交','【尚未繳交】'],['待訂正','【尚待訂正】']];const lines=['家長您好：','以下是'+seatName(i)+'孩子目前尚未完成的作業，麻煩您協助提醒孩子完成。'];let found=false;for(const [s,title] of groups){const g=tasks.filter(t=>t.records[i]===s).sort((a,b)=>a.date.localeCompare(b.date)||a.subject.localeCompare(b.subject,'zh-TW'));if(!g.length)continue;found=true;lines.push('',title,...g.map((t,j)=>(j+1)+'. '+t.date+' '+t.subject+'／'+t.name))}if(!found)return '家長您好：'+seatName(i)+'孩子目前系統沒有缺交或待訂正紀錄，仍請留意尚未檢查的作業。謝謝您的配合！';lines.push('','請提醒孩子完成後帶回學校交給老師確認，謝謝您的協助與配合！');return lines.join('\n')}

$('notice').onclick=()=>{const i=$('filter').value;if(!i){exportDemoClass();return}$('noticeText').textContent=makeDemoNotice(i)};function showParent(i){active=i;$('result').hidden=false;$('who').textContent=seatName(i)+'虛構學生';$('records').replaceChildren(...['缺交','待訂正','已繳交','已完成'].map(s=>{const d=node('div','');d.append(node('h2',s));const list=tasks.filter(t=>t.records[i]===s);d.append(...(list.length?list.map(t=>node('article',t.date+' '+t.subject+'／'+t.name)): [node('p','目前沒有紀錄')]));return d}))}function lookup(){const c=$('code').value.trim().toUpperCase(),m=/^DEMO(0[1-9]|1[0-9]|2[0-5])$/.exec(c);forget();active=null;$('result').hidden=true;if(!m){$('status').textContent='體驗碼無效';return}showParent(String(Number(m[1])));$('status').textContent=$('remember').checked?(write(mem,c)?'已記住此裝置':'此瀏覽器不支援儲存'):'查詢成功'}$('lookup').onclick=lookup;$('remember').onchange=()=>{if(!$('remember').checked)forget();else if(active)write(mem,'DEMO'+active.padStart(2,'0'))};$('logout').onclick=()=>{forget();active=null;$('result').hidden=true;$('code').value='';$('remember').checked=false;$('status').textContent='已結束查詢'};$('share').onclick=()=>{const c='DEMO'+$('shareSeat').value.padStart(2,'0');const url=location.href.split('#')[0]+'#code='+c;$('shareLink').value=url;$('openLink').href='#code='+c;$('openLink').hidden=false};function fromHash(){if(location.hash==='#parent'){page('parent');return}const c=new URLSearchParams(location.hash.slice(1)).get('code');if(c){page('parent');$('remember').checked=false;$('code').value=c;lookup();try{history.replaceState(null,'',location.href.split('#')[0])}catch{}}}window.addEventListener('hashchange',fromHash);$('reset').onclick=()=>{if(confirm('重置虛構資料？')){tasks=seed();selected=tasks[0].id;undo=null;$('logout').click();save()}};render();page('home');fromHash();</script>
